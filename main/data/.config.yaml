# Refer to main/xiaozhi-server/data/.config.yaml needed by RENDER web service due to hard-coded path in RENDER
# XiaoZhi AI Server Configuration Template
server:
  listen_port: 10000
  log_level: "INFO"

# OpenRouter/OpenAI Configuration
llm:
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"
  model: "${LLM_MODEL}"
